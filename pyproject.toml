[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-plataforma-referencia"
version = "0.1.0"
description = "Arquitetura de referência para o Dicionário e Vocabulário da ACL"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0,<7",
]

[project.scripts]
acl-reference = "acl_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
